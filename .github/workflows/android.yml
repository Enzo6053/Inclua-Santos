name: App Android (APK e AAB)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write  # para atualizar a "Versão de teste" com o APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Instalar o Android 16 (API 36)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Preparar a chave de upload
        if: env.TEM_CHAVE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gerar APK e AAB assinados
        if: env.TEM_CHAVE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../saida
          cp app/build/outputs/apk/release/app-release.apk "../saida/inclua-santos-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../saida/inclua-santos-$VERSION_NAME.aab"

      - name: Gerar APK de teste (sem a chave de upload)
        if: env.TEM_CHAVE != 'true'
        working-directory: android
        run: |
          echo "::warning::Os segredos da chave de upload ainda não foram cadastrados. Gerando só um APK de teste (debug), que não serve para a Play."
          # a versão final também é compilada (sem assinatura) para os erros aparecerem antes da chave
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
          mkdir -p ../saida
          cp app/build/outputs/apk/debug/app-debug.apk "../saida/inclua-santos-$VERSION_NAME-debug.apk"

      - name: Conferir a assinatura
        if: env.TEM_CHAVE == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "saida/inclua-santos-$VERSION_NAME.apk" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v6
        with:
          name: inclua-santos-${{ env.VERSION_NAME }}
          path: saida/*
          if-no-files-found: error

      - name: Atualizar a Versão de teste (APK para instalar no celular)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.TEM_CHAVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "saida/inclua-santos-$VERSION_NAME.apk" saida/inclua-santos-teste.apk
          NOTAS="APK mais recente do app Inclua Santos ($VERSION_NAME), para instalar e testar no celular. Este arquivo muda a cada atualização do app."
          gh release view teste > /dev/null 2>&1 || gh release create teste --prerelease --title "Versão de teste" --notes "$NOTAS"
          gh release edit teste --notes "$NOTAS"
          gh release upload teste saida/inclua-santos-teste.apk --clobber
